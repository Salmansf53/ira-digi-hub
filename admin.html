<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iRA Digi HUB - Secure Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans h-screen overflow-hidden">

    <!-- ================= 1. LOGIN SCREEN (SECURE GATEWAY) ================= -->
    <div id="loginScreen" class="h-screen w-full flex items-center justify-center bg-[#0b0f19] absolute z-50">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md mx-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-500 to-indigo-600"></div>
            
            <div class="text-center mb-8">
                <div class="text-3xl font-bold mb-2">iRA<span class="text-purple-600">DIGI</span>HUB</div>
                <p class="text-gray-500 font-medium">Restricted Area. Admin Access Only.</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Admin Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="adminEmail" required placeholder="Enter your admin email" class="w-full border border-gray-300 rounded-lg p-3.5 pl-10 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-lock"></i></span>
                        <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-3.5 pl-10 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-lg transition duration-300 shadow-md">
                    <i class="fas fa-sign-in-alt mr-2"></i> Secure Login
                </button>
            </form>
            <div id="loginError" class="mt-4 text-center text-red-500 text-sm font-bold hidden">Invalid email or password!</div>
        </div>
    </div>

    <!-- ================= 2. MAIN DASHBOARD (HIDDEN BY DEFAULT) ================= -->
    <div id="dashboardScreen" class="hidden flex h-screen w-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#0b0f19] text-white flex flex-col hidden md:flex shadow-2xl relative z-20">
            <div class="h-20 flex items-center px-8 border-b border-gray-800">
                <div class="text-2xl font-bold tracking-wide">iRA<span class="text-purple-500">DIGI</span>HUB</div>
            </div>
            <div class="flex-1 overflow-y-auto py-6">
                <div class="px-6 text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Menu</div>
                <ul class="space-y-2 px-4">
                    <li>
                        <a href="#" class="flex items-center space-x-3 bg-gradient-to-r from-purple-600 to-purple-800 text-white px-4 py-3 rounded-lg shadow-md border border-purple-500/30">
                            <i class="fas fa-plus-circle w-5"></i>
                            <span class="font-medium">Add Product</span>
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="p-6 border-t border-gray-800 bg-[#131929]">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center font-bold text-lg shadow-lg">A</div>
                        <div>
                            <div class="font-bold text-sm">Aftab</div>
                            <div class="text-xs text-green-400 flex items-center mt-1">
                                <span class="w-2 h-2 rounded-full bg-green-400 mr-1 animate-pulse"></span> Online
                            </div>
                        </div>
                    </div>
                    <!-- Logout Button -->
                    <button id="logoutBtn" class="text-gray-400 hover:text-red-500 transition" title="Logout">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
                <h1 class="text-2xl font-bold text-gray-800">Admin Workspace</h1>
                <div class="flex items-center bg-green-50 text-green-700 px-4 py-2 rounded-full border border-green-200 text-sm font-medium">
                    <i class="fas fa-shield-alt text-green-500 mr-2"></i> Authenticated
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="max-w-4xl mx-auto">
                    <!-- Product Upload Form -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-10">
                        <div class="bg-gray-50/50 px-8 py-5 border-b border-gray-100 flex justify-between items-center">
                            <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-cloud-upload-alt text-purple-500 mr-2"></i>Publish New Product</h2>
                        </div>
                        <div class="p-8">
                            <form id="addProductForm" class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Product Name *</label>
                                        <input type="text" id="prodName" required class="w-full border border-gray-300 rounded-lg p-3.5 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Price (₹) *</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 font-bold">₹</span>
                                            <input type="number" id="prodPrice" required class="w-full border border-gray-300 rounded-lg p-3.5 pl-8 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50">
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Category *</label>
                                    <select id="prodCategory" class="w-full border border-gray-300 rounded-lg p-3.5 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50">
                                        <option value="Excel Templates">Excel Templates</option>
                                        <option value="Business Templates">Business Templates</option>
                                        <option value="Canva Templates">Canva Templates</option>
                                        <option value="Finance">Finance</option>
                                        <option value="Planners">Planners</option>
                                        <option value="Resume & CV">Resume & CV</option>
                                        <option value="eBooks & Guides">eBooks & Guides</option>
                                        <option value="Tools & Software">Tools & Software</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Description *</label>
                                    <textarea id="prodDesc" required rows="3" class="w-full border border-gray-300 rounded-lg p-3.5 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50"></textarea>
                                </div>

                                <hr class="border-gray-100 my-6">

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Google Drive File Link *</label>
                                    <input type="url" id="prodFileLink" required class="w-full border border-gray-300 rounded-lg p-3.5 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50">
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Image Links (Comma Separated) *</label>
                                    <textarea id="prodImageLink" required rows="2" class="w-full border border-gray-300 rounded-lg p-3.5 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-50/50"></textarea>
                                </div>

                                <button type="submit" class="w-full px-8 bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-lg transition duration-300 shadow-lg text-lg">
                                    <i class="fas fa-rocket mr-2"></i> Publish Product
                                </button>
                            </form>
                            <div id="statusMessage" class="mt-6 text-center font-bold hidden p-4 rounded-lg"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= FIREBASE AUTH & DATABASE SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        // Authentication Modules Naye Add kiye gaye hain
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdpekXgFaepzFN9Ecvvyw2jPh9FPikjYQ",
            authDomain: "ira-digi-hub.firebaseapp.com",
            databaseURL: "https://ira-digi-hub-default-rtdb.firebaseio.com",
            projectId: "ira-digi-hub",
            storageBucket: "ira-digi-hub.firebasestorage.app",
            messagingSenderId: "501602413995",
            appId: "1:501602413995:web:60ba782855226fd1a476ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); // Security Lock Engine

        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');

        // 1. Check User Status (Lock/Unlock)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Sahi password - Dashboard khol do
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.classList.add('flex');
            } else {
                // Bahar nikal do - Login screen dikhao
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
                dashboardScreen.classList.remove('flex');
            }
        });

        // 2. Login Button Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('loginError');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Verifying...';
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Auth state observer apne aap dashboard khol dega
            } catch (error) {
                errorMsg.classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Secure Login';
            }
        });

        // 3. Logout Button Logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // 4. Product Upload Logic (Sirf Dashboard ke andar chalega)
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const status = document.getElementById('statusMessage');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Publishing...';
            
            const rawImageLinks = document.getElementById('prodImageLink').value;
            const imageArray = rawImageLinks.split(',').map(link => link.trim()).filter(link => link !== "");

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('prodName').value,
                    price: Number(document.getElementById('prodPrice').value),
                    category: document.getElementById('prodCategory').value,
                    description: document.getElementById('prodDesc').value,
                    fileLink: document.getElementById('prodFileLink').value,
                    images: imageArray,
                    dateAdded: new Date().toISOString()
                });

                status.innerHTML = "<i class='fas fa-check-circle mr-2'></i> Product Published!";
                status.className = "mt-6 text-center font-bold text-green-700 bg-green-50 p-4 rounded-lg border border-green-200 block";
                e.target.reset(); 
            } catch (error) {
                status.innerHTML = "<i class='fas fa-exclamation-triangle mr-2'></i> Error Publishing.";
                status.className = "mt-6 text-center font-bold text-red-700 bg-red-50 p-4 rounded-lg border border-red-200 block";
            } finally {
                btn.innerHTML = '<i class="fas fa-rocket mr-2"></i> Publish Product';
                setTimeout(() => { status.classList.add('hidden'); }, 4000);
            }
        });
    </script>
</body>
</html>
