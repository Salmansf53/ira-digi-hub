<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & DYNAMIC OG TAGS (For WhatsApp/Facebook Sharing) -->
    <title id="page-title">Product Details - iRA Digi HUB</title>
    <meta name="description" content="Download premium digital products, templates, and tools to grow your business instantly.">
    <meta property="og:title" content="iRA Digi HUB - Premium Digital Products">
    <meta property="og:description" content="Check out this premium digital product. Instant download & lifetime access!">
    <meta property="og:image" content="https://placehold.co/1200x630/0b0f19/white?text=iRA+Digi+HUB">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

    <nav class="bg-[#0b0f19] text-white px-8 py-4 flex items-center justify-between border-b border-gray-800 sticky top-0 z-50">
        <a href="index.html" class="text-2xl font-bold cursor-pointer">
            iRA<span class="text-purple-500">DIGI</span>HUB
        </a>
        <div class="flex items-center space-x-6 text-sm font-medium">
            <a href="store.html" class="hover:text-purple-400 transition">All Products</a>
        </div>
    </nav>

    <div id="loading" class="flex-1 flex flex-col items-center justify-center py-20">
        <i class="fas fa-circle-notch fa-spin text-5xl text-purple-600 mb-4"></i>
    </div>

    <main id="product-content" class="flex-1 max-w-6xl mx-auto px-4 py-12 hidden w-full">
        <!-- Breadcrumb -->
        <div class="text-sm text-gray-500 mb-6">
            <a href="index.html" class="hover:text-purple-600">Home</a> <i class="fas fa-chevron-right text-xs mx-2"></i> 
            <span id="bc-category" class="text-gray-700">Category</span> <i class="fas fa-chevron-right text-xs mx-2"></i> 
            <span id="bc-name" class="text-gray-900 font-bold">Product</span>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden flex flex-col md:flex-row mb-12">
            
            <!-- Left: Image Slider -->
            <div class="md:w-1/2 p-6 bg-gray-50 flex flex-col">
                <div class="w-full h-80 bg-gray-200 rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-4 relative flex items-center justify-center">
                    <span id="badge-category" class="absolute top-3 left-3 bg-[#0b0f19] text-white px-3 py-1 text-[10px] font-bold rounded uppercase tracking-wider z-10 shadow-lg">CAT</span>
                    <img id="main-image" class="w-full h-full object-cover transition duration-300">
                </div>
                <!-- Thumbnails (Dynamically Populated) -->
                <div id="thumbnail-container" class="flex space-x-3 overflow-x-auto py-2">
                    <!-- JS will insert mini images here -->
                </div>
            </div>
            
            <!-- Right: Product Info & Buy Button -->
            <div class="md:w-1/2 p-8 md:p-10 flex flex-col relative">
                
                <!-- Title & Share Button Wrapper -->
                <div class="flex justify-between items-start mb-3">
                    <h1 id="detail-name" class="text-3xl font-extrabold text-gray-900 leading-tight pr-4">Product Name</h1>
                    
                    <!-- NEW SHARE BUTTON -->
                    <button id="shareBtn" class="bg-purple-100 hover:bg-purple-200 text-purple-600 rounded-full w-10 h-10 flex items-center justify-center transition flex-shrink-0 shadow-sm" title="Share this product">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
                
                <div class="flex items-center space-x-4 mb-6">
                    <div class="flex items-center text-yellow-400 text-sm">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                    </div>
                    <span class="text-sm text-gray-500 font-medium border-b border-dashed border-gray-400 pb-0.5">4.9 (120+ Reviews)</span>
                </div>

                <div class="flex items-end space-x-3 mb-6">
                    <span class="text-4xl font-black text-purple-600">₹<span id="detail-price">0</span></span>
                    <span class="text-lg text-gray-400 line-through font-medium mb-1">₹499</span>
                    <span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded mb-2">Save 60%</span>
                </div>

                <div class="mb-8 flex-grow">
                    <h3 class="font-bold text-gray-800 mb-2 uppercase text-xs tracking-wider">Product Overview</h3>
                    <p id="detail-desc" class="text-gray-600 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- Security Icons (Trust Badges) -->
                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 rounded-lg p-4 mb-6">
                    <div class="flex flex-col items-center text-center">
                        <i class="fas fa-bolt text-yellow-500 text-xl mb-1"></i>
                        <span class="text-[10px] font-bold text-gray-600 uppercase">Instant<br>Access</span>
                    </div>
                    <div class="flex flex-col items-center text-center">
                        <i class="fas fa-lock text-green-500 text-xl mb-1"></i>
                        <span class="text-[10px] font-bold text-gray-600 uppercase">Secure<br>Payment</span>
                    </div>
                    <div class="flex flex-col items-center text-center">
                        <i class="fas fa-infinity text-blue-500 text-xl mb-1"></i>
                        <span class="text-[10px] font-bold text-gray-600 uppercase">Lifetime<br>Updates</span>
                    </div>
                </div>

                <!-- BUY NOW BUTTON (Navigates to checkout page later) -->
                <button id="buyNowBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-lg py-4 rounded-xl shadow-xl transition duration-300 flex items-center justify-center transform hover:-translate-y-1">
                    <i class="fas fa-shopping-cart mr-2"></i> Buy Now - Secure Checkout
                </button>
            </div>
        </div>

        <!-- REVIEWS SECTION (DYNAMIC) -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h2 class="text-xl font-bold text-gray-900 mb-6 border-b pb-4">Customer Reviews</h2>
            <div id="dynamic-reviews-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Loading State -->
                <div class="col-span-full text-center py-6 text-gray-500 font-medium">
                    <i class="fas fa-circle-notch fa-spin mr-2 text-purple-500"></i> Loading genuine customer reviews...
                </div>
            </div>
        </div>
    </main>

    <div class="bg-[#0b0f19] text-center py-6 text-sm text-gray-500 font-medium mt-12 w-full mt-auto">
        © 2026 iRA Digi HUB. All rights reserved.
    </div>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdpekXgFaepzFN9Ecvvyw2jPh9FPikjYQ",
            authDomain: "ira-digi-hub.firebaseapp.com",
            databaseURL: "https://ira-digi-hub-default-rtdb.firebaseio.com",
            projectId: "ira-digi-hub",
            storageBucket: "ira-digi-hub.firebasestorage.app",
            messagingSenderId: "501602413995",
            appId: "1:501602413995:web:60ba782855226fd1a476ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function fetchReviews(pId) {
            const reviewsContainer = document.getElementById('dynamic-reviews-container');
            try {
                const q = query(collection(db, "reviews"), where("productId", "==", pId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    reviewsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 italic py-4">No reviews yet. Be the first to review after purchasing!</div>';
                    return;
                }

                reviewsContainer.innerHTML = '';
                
                const reviewsList = [];
                querySnapshot.forEach((doc) => reviewsList.push(doc.data()));
                
                reviewsList.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));

                reviewsList.forEach((review) => {
                    const initial = review.name ? review.name.charAt(0).toUpperCase() : 'U';
                    const rating = review.rating || 5;
                    const starsHtml = '<i class="fas fa-star"></i>'.repeat(rating) + '<i class="far fa-star text-gray-300"></i>'.repeat(5 - rating);

                    reviewsContainer.innerHTML += `
                        <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition">
                            <div class="flex items-center space-x-3 mb-3">
                                <div class="w-10 h-10 bg-gradient-to-br from-purple-400 to-indigo-500 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-sm">${initial}</div>
                                <div>
                                    <div class="font-bold text-sm text-gray-800">${review.name} <span class="text-green-500 text-[10px] ml-1 font-medium bg-green-100 px-1.5 py-0.5 rounded-full"><i class="fas fa-check-circle"></i> Verified Buyer</span></div>
                                    <div class="text-yellow-400 text-[11px] flex space-x-0.5 mt-1">${starsHtml}</div>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600 italic leading-relaxed">"${review.text}"</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading reviews:", error);
                reviewsContainer.innerHTML = '<div class="col-span-full text-center text-red-400 text-sm">Could not load reviews at this time.</div>';
            }
        }

        async function fetchProductDetails() {
            if (!productId) return;

            try {
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const product = docSnap.data();
                    
                    document.getElementById('bc-category').innerText = product.category || 'Product';
                    document.getElementById('bc-name').innerText = product.name || 'Details';
                    document.getElementById('badge-category').innerText = product.category || 'Digital';
                    document.getElementById('detail-name').innerText = product.name || 'Premium Digital Product';
                    document.getElementById('detail-price').innerText = product.price || '99';
                    document.getElementById('detail-desc').innerText = product.description || 'No description provided.';
                    
                    document.getElementById('page-title').innerText = `${product.name} - iRA Digi HUB`;

                    const mainImg = document.getElementById('main-image');
                    const thumbContainer = document.getElementById('thumbnail-container');
                    const defaultImgUrl = 'https://placehold.co/600x400/1e1e1e/white?text=Digital+Product';
                    
                    mainImg.onerror = function() {
                        this.onerror = null; 
                        this.src = defaultImgUrl;
                    };

                    let imageArray = [];
                    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                        imageArray = product.images;
                    } else if (product.image && typeof product.image === 'string') {
                        imageArray = [product.image];
                    } else if (product.imageUrl && typeof product.imageUrl === 'string') {
                        imageArray = [product.imageUrl];
                    }

                    if (imageArray.length > 0 && imageArray[0].trim() !== '') {
                        mainImg.src = imageArray[0]; 
                        
                        document.querySelector('meta[property="og:image"]').setAttribute("content", imageArray[0]);
                        
                        imageArray.forEach((imgUrl) => {
                            if (imgUrl.trim() !== '') {
                                const thumb = document.createElement('img');
                                thumb.className = "w-16 h-16 object-cover rounded-md cursor-pointer border-2 border-transparent hover:border-purple-500 transition opacity-70 hover:opacity-100 bg-gray-200";
                                
                                thumb.onerror = function() { 
                                    this.onerror = null; 
                                    this.src = defaultImgUrl; 
                                };
                                thumb.src = imgUrl; 
                                
                                thumb.onclick = () => { 
                                    mainImg.onerror = function() { 
                                        this.onerror = null; 
                                        this.src = defaultImgUrl; 
                                    };
                                    mainImg.src = imgUrl; 
                                };
                                thumbContainer.appendChild(thumb);
                            }
                        });
                    } else {
                        mainImg.src = defaultImgUrl;
                    }
                    
                    document.querySelector('meta[property="og:title"]').setAttribute("content", `${product.name} - iRA Digi HUB`);
                    document.querySelector('meta[property="og:description"]').setAttribute("content", product.description || "Check out this premium digital product. Instant download & lifetime access!");

                    // ==========================================
                    // UPDATED SHARE LOGIC (Caption Hack for WhatsApp)
                    // ==========================================
                    const shareBtn = document.getElementById('shareBtn');
                    shareBtn.onclick = async () => {
                        const originalIcon = shareBtn.innerHTML;
                        shareBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 
                        
                        // TRICK: Link ko text ke andar add kiya, alag se "url" pass nahi karenge.
                        const captionText = `Check out ${product.name} at iRA Digi HUB! Get instant access to premium digital templates.\n\n${window.location.href}`;
                        
                        try {
                            let sharedWithImage = false;
                            
                            if (navigator.canShare && mainImg.src && !mainImg.src.includes('placehold.co')) {
                                try {
                                    const response = await fetch(mainImg.src);
                                    const blob = await response.blob();
                                    const file = new File([blob], 'product-image.jpg', { type: blob.type });
                                    
                                    // Yahan "url: window.location.href" hata diya taaki WhatsApp isko image ka caption samjhe!
                                    const shareDataWithFile = {
                                        title: product.name,
                                        text: captionText,
                                        files: [file]
                                    };

                                    if (navigator.canShare(shareDataWithFile)) {
                                        await navigator.share(shareDataWithFile);
                                        sharedWithImage = true;
                                    }
                                } catch (fetchErr) {
                                    console.log("Could not fetch image for sharing.");
                                }
                            }

                            if (!sharedWithImage) {
                                if (navigator.share) {
                                    await navigator.share({
                                        title: product.name,
                                        text: `Check out ${product.name} at iRA Digi HUB! Get instant access to premium digital templates.`,
                                        url: window.location.href
                                    });
                                } else {
                                    navigator.clipboard.writeText(window.location.href);
                                    alert("Link copied to clipboard!");
                                }
                            }
                        } catch (err) {
                            console.log('Share window closed or failed.');
                        } finally {
                            shareBtn.innerHTML = originalIcon; 
                        }
                    };
                    // ==========================================

                    document.getElementById('buyNowBtn').onclick = () => {
                        window.location.href = `checkout.html?id=${productId}`;
                    };

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('product-content').classList.remove('hidden');

                    fetchReviews(productId);
                }
            } catch (error) {
                console.error("Error fetching product:", error);
                document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">Error loading product details. Please try again.</p>';
            }
        }

        fetchProductDetails();
    </script>
</body>
</html>
